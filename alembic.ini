# Só para quem desenvolve: gerar uma migração nova depois de mudar um modelo.
#   uv run alembic revision --autogenerate -m "descrição"
# A app não usa este arquivo: aplica as migrações sozinha ao ligar (repositorio.banco.migrar).
# O banco comparado é um arquivo descartável, criado e migrado na hora (veja o README).

[alembic]
script_location = %(here)s/src/descoberta/repositorio/migracoes
file_template = %%(rev)s_%%(slug)s
banco = data/alembic-dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
