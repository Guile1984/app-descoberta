# Questionário da sessão de descoberta — versão 1.
# Fonte: docs/modelo-descoberta.md. Validado por descoberta.questionario (Pydantic).
#
# Convenções:
# - ids das perguntas: b{bloco}.o{n} (obrigatória), b{bloco}.a{n} (aprofundamento),
#   b{bloco}.vc{n} (condicional de visão computacional); sinais: b{bloco}.s{n}.
#   Os ids são gravados no banco junto com as respostas: NÃO renomeie um id existente.
#   Para mudar o sentido de uma pergunta, crie uma nova versão do questionário.
# - condicao.tipos_solucao: a pergunta só aparece se o tipo escolhido no bloco 3 estiver
#   na lista (ids definidos em tipos_solucao).
# - Scores: cada critério vale de 0 a 3; as faixas são intervalos fechados [min, max].

versao: 1
titulo: Modelo de Descoberta — Apps de IA para PMEs

orientacoes:
  - >-
    A sessão de descoberta responde três perguntas antes de qualquer proposta: a dor é
    real, a IA é o caminho certo e os dados permitem fazê-la.
  - "Duração-alvo: 60 a 90 minutos, com o decisor presente."
  - "Perguntas obrigatórias: feitas em toda sessão."
  - >-
    Perguntas de aprofundamento: usadas quando o tempo permite ou a resposta obrigatória
    ficou vaga.
  - "Sinais de alerta: anotados durante a conversa; alimentam o score final."
  - "Saída de cada bloco: o que precisa estar registrado antes de passar ao próximo."
  - >-
    Linguagem: de negócio, nunca técnica. A tradução para requisitos técnicos é trabalho
    seu, depois da sessão.
  - >-
    Perguntas condicionais: o bloco 3 define o tipo de solução, e isso abre perguntas
    específicas nos blocos seguintes.
  - >-
    Antes da sessão, peça ao cliente uma amostra dos dados. Depois dela, entregue o
    Relatório de Descoberta (bloco 10) em até 48 h.

# Árvore de decisão do bloco 3: cada situação indica um tipo de solução.
tipos_solucao:
  - id: automacao_sem_ia
    rotulo: Automação tradicional, sem IA
    situacao: Regras claras e estáveis
  - id: ml_classico
    rotulo: ML clássico (classificação/previsão)
    situacao: Tabelas + histórico com resultado
  - id: llm_rag
    rotulo: LLM com RAG
    situacao: Documentos, e-mails, perguntas frequentes
  - id: visao_computacional
    rotulo: Visão computacional
    situacao: Imagens ou vídeo
  - id: agente_llm
    rotulo: Agente com LLM
    situacao: Tarefa com várias etapas e ferramentas
  - id: coletar_dados
    rotulo: Coletar dados primeiro, sem IA ainda
    situacao: Sem histórico e sem regras

blocos:
  - numero: 1
    id: problema
    titulo: Problema de negócio
    objetivo: Sair com uma dor nomeada, medida e com dono.
    saida_esperada: >-
      Frase-problema: "Hoje [quem] gasta [quanto] fazendo [o quê], o que causa [impacto].
      O sucesso será [métrica] em [prazo]." Com as perguntas 2 a 4, estime o custo mensal
      da dor; ele é o teto do orçamento razoável.
    perguntas:
      - id: b1.o1
        tipo: obrigatoria
        texto: Qual tarefa ou situação mais toma tempo ou dinheiro da empresa hoje?
      - id: b1.o2
        tipo: obrigatoria
        texto: Com que frequência isso acontece (por dia ou por semana)?
      - id: b1.o3
        tipo: obrigatoria
        texto: Quantas pessoas se envolvem e quanto tempo cada uma gasta?
      - id: b1.o4
        tipo: obrigatoria
        texto: O que acontece quando dá errado? (cliente perdido, retrabalho, multa, atraso)
      - id: b1.o5
        tipo: obrigatoria
        texto: Se isso estivesse resolvido daqui a 6 meses, o que mudaria concretamente?
      - id: b1.o6
        tipo: obrigatoria
        texto: Quem decide sobre o investimento e quem vai usar a solução no dia a dia?
      - id: b1.o7
        tipo: obrigatoria
        texto: Quem mais conhece esse processo a fundo e precisa participar da próxima conversa?
      - id: b1.a1
        tipo: aprofundamento
        texto: Já tentaram resolver antes? Com o quê, e por que não funcionou?
      - id: b1.a2
        tipo: aprofundamento
        texto: Isso afeta o faturamento diretamente ou só o custo operacional?
      - id: b1.a3
        tipo: aprofundamento
        texto: Existe sazonalidade, com picos em certos meses?
      - id: b1.a4
        tipo: aprofundamento
        texto: Algum concorrente já resolve isso melhor?
    sinais:
      - id: b1.s1
        peso: 1
        texto: O cliente quer "usar IA" sem conseguir nomear uma dor específica.
      - id: b1.s2
        peso: 1
        texto: A dor acontece poucas vezes por mês, o que torna o retorno improvável.
      - id: b1.s3
        peso: 1
        texto: Quem decide não está presente na sessão.
      - id: b1.s4
        peso: 1
        texto: A expectativa é de 100% de acerto ou zero intervenção humana.

  - numero: 2
    id: processo
    titulo: Processo atual × futuro
    objetivo: Desenhar como a tarefa é feita hoje e onde a IA entraria.
    saida_esperada: >-
      Fluxograma as-is e to-be, marcando onde a IA entra e onde fica a revisão humana.
      Se o passo crítico for uma decisão por regra fixa, o bloco 3 tende a indicar
      automação sem IA.
    perguntas:
      - id: b2.o1
        tipo: obrigatoria
        texto: Descreva passo a passo como a tarefa é feita hoje, do início ao fim.
      - id: b2.o2
        tipo: obrigatoria
        texto: Quais ferramentas são usadas em cada passo? (planilha, ERP, WhatsApp, papel)
      - id: b2.o3
        tipo: obrigatoria
        texto: Em qual passo há mais demora, erro ou retrabalho?
      - id: b2.o4
        tipo: obrigatoria
        texto: >-
          Quais decisões são tomadas no processo, e com base em quê? (experiência, regra,
          tabela)
      - id: b2.o5
        tipo: obrigatoria
        texto: O que pode ser automatizado e o que precisa continuar com uma pessoa?
      - id: b2.a1
        tipo: aprofundamento
        texto: O processo é igual para todos os funcionários ou cada um faz do seu jeito?
      - id: b2.a2
        tipo: aprofundamento
        texto: Existe alguma regra documentada, ou ela está "na cabeça" de alguém?
      - id: b2.a3
        tipo: aprofundamento
        texto: Quem seria afetado por mudanças? Há resistência prevista da equipe?
    sinais:
      - id: b2.s1
        peso: 1
        texto: >-
          Ninguém descreve o processo de forma consistente: primeiro padronizar, depois
          automatizar.
      - id: b2.s2
        peso: 1
        texto: O conhecimento está concentrado em uma pessoa que não participa da sessão.
      - id: b2.s3
        peso: 1
        texto: O passo problemático depende de informação que não é registrada em lugar nenhum.

  - numero: 3
    id: adequacao_ia
    titulo: Adequação de IA
    objetivo: >-
      Decidir se o projeto usa IA e de que tipo. "Não precisa de IA" é uma resposta
      válida e gera confiança.
    saida_esperada: >-
      Tipo de solução, baseline (como seria resolvido sem IA ou por um humano) e
      justificativa curta. Se o caminho for "sem IA", a sessão continua com escopo de
      automação.
    perguntas:
      - id: b3.o1
        tipo: obrigatoria
        texto: >-
          A decisão ou tarefa segue regras claras que alguém conseguiria escrever? ("se X,
          então Y")
      - id: b3.o2
        tipo: obrigatoria
        texto: >-
          Existe histórico de casos passados com o resultado conhecido? (ex.: pedidos
          aprovados/recusados, peças boas/defeituosas)
      - id: b3.o3
        tipo: obrigatoria
        texto: "Qual é o insumo principal: números/tabelas, textos/documentos, imagens, áudio?"
      - id: b3.o4
        tipo: obrigatoria
        texto: Um erro da IA é aceitável se for raro? Qual o pior erro possível?
      - id: b3.o5
        tipo: obrigatoria
        texto: >-
          A empresa precisa explicar por que a decisão foi tomada? (cliente, fiscal, órgão
          regulador)
      - id: b3.a1
        tipo: aprofundamento
        texto: Uma pessoa experiente acerta quanto? Isso vira a meta realista para a IA.
      - id: b3.a2
        tipo: aprofundamento
        texto: A tarefa muda com frequência (regras, produtos, preços)?
      - id: b3.a3
        tipo: aprofundamento
        texto: O resultado precisa sair na hora ou pode levar minutos/horas?
    sinais:
      - id: b3.s1
        peso: 1
        texto: Erro inaceitável e sem possibilidade de revisão humana.
      - id: b3.s2
        peso: 1
        texto: >-
          Exigência de explicação total, com caminho pensado em caixa-preta (deep learning
          ou LLM).
      - id: b3.s3
        peso: 1
        texto: Expectativa de que a IA "descubra sozinha" o que fazer, sem exemplos.

  - numero: 4
    id: dados
    titulo: Dados
    objetivo: >-
      Medir quanto falta para os dados serem usáveis. Em PMEs, o dado quase sempre existe,
      mas espalhado ou incompleto.
    saida_esperada: >-
      Inventário de fontes, score de prontidão e, se o score for baixo, uma fase 0 de
      estruturação de dados no escopo. Peça a amostra antes de enviar a proposta comercial.
    perguntas:
      - id: b4.o1
        tipo: obrigatoria
        texto: >-
          Onde os dados dessa tarefa ficam hoje? (ERP, planilhas, e-mail, WhatsApp, pastas,
          papel)
      - id: b4.o2
        tipo: obrigatoria
        texto: Há quanto tempo vocês registram isso? Quantos casos existem, mais ou menos?
      - id: b4.o3
        tipo: obrigatoria
        texto: >-
          O resultado de cada caso também foi registrado? (ex.: "a fissura era grave", "o
          cliente pagou")
      - id: b4.o4
        tipo: obrigatoria
        texto: Quem tem acesso e quem é o dono desses dados? É possível exportá-los?
      - id: b4.o5
        tipo: obrigatoria
        texto: >-
          Há dados pessoais de clientes ou funcionários? (CPF, telefone, saúde, salário)
      - id: b4.a1
        tipo: aprofundamento
        texto: Os dados seguem um padrão ou cada pessoa preenche de um jeito?
      - id: b4.a2
        tipo: aprofundamento
        texto: Há muitos campos vazios, duplicados ou com erro de digitação?
      - id: b4.a3
        tipo: aprofundamento
        texto: Novos dados continuarão chegando depois da entrega? Em que volume?
      - id: b4.a4
        tipo: aprofundamento
        texto: Existe algum dado que deveria ser coletado e não é?
      - id: b4.a5
        tipo: aprofundamento
        texto: Podem enviar uma amostra antes da próxima reunião?
      # Condicionais — visão computacional (quando o bloco 3 indicar imagens ou vídeo).
      - id: b4.vc1
        tipo: obrigatoria
        condicao: {tipos_solucao: [visao_computacional]}
        texto: Quem tira as fotos e com qual aparelho?
      - id: b4.vc2
        tipo: obrigatoria
        condicao: {tipos_solucao: [visao_computacional]}
        texto: >-
          Existe padrão de distância, ângulo e iluminação, ou cada um fotografa de um
          jeito?
      - id: b4.vc3
        tipo: obrigatoria
        condicao: {tipos_solucao: [visao_computacional]}
        texto: As fotos têm referência de escala (régua, fissurômetro, objeto conhecido)?
      - id: b4.vc4
        tipo: obrigatoria
        condicao: {tipos_solucao: [visao_computacional]}
        texto: Em que formato e resolução as imagens ficam guardadas?
    sinais:
      - id: b4.s1
        peso: 1
        texto: '"Temos muitos dados", mas ninguém sabe dizer onde estão.'
      - id: b4.s2
        peso: 1
        texto: Dados de terceiros sem autorização de uso.
      - id: b4.s3
        peso: 1
        texto: Rótulos dependem de alguém revisar milhares de casos manualmente.
      - id: b4.s4
        peso: 1
        texto: Dados pessoais sensíveis sem consentimento ou base legal.
    notas:
      - >-
        Score de prontidão de dados: 5 critérios de 0 a 3 (ver scores.prontidao_dados).
        Abaixo de 6, começar por organizar e coletar dados; de 6 a 10, MVP com ressalvas;
        acima de 10, pronto para modelar.
      - >-
        Visão computacional: sem padrão de captura, a fase 0 inclui um protocolo simples
        de fotografia antes de qualquer treinamento de modelo.

  - numero: 5
    id: criterios_sucesso
    titulo: Critérios de sucesso
    objetivo: >-
      Transformar "quero que funcione bem" em números combinados antes do desenvolvimento.
    saida_esperada: >-
      Tabela "indicador atual → meta → prazo → como medir" e critério de aceite assinado
      pelo cliente.
    perguntas:
      - id: b5.o1
        tipo: obrigatoria
        texto: >-
          Qual número do negócio precisa mudar? (horas gastas, custo, prazo, taxa de erro,
          faturamento)
      - id: b5.o2
        tipo: obrigatoria
        texto: Qual o valor atual desse número e qual a meta?
      - id: b5.o3
        tipo: obrigatoria
        texto: Em quanto tempo após a entrega vocês esperam ver o resultado?
      - id: b5.o4
        tipo: obrigatoria
        texto: >-
          Qual erro é pior: a IA deixar passar um problema real, ou apontar um problema
          que não existe?
      - id: b5.o5
        tipo: obrigatoria
        texto: Quem confere o resultado da IA antes de virar ação, e por quanto tempo?
      - id: b5.a1
        tipo: aprofundamento
        texto: Quanto custa, em reais, cada tipo de erro?
      - id: b5.a2
        tipo: aprofundamento
        texto: Um acerto parecido com o de um funcionário experiente já é suficiente?
      - id: b5.a3
        tipo: aprofundamento
        texto: Como vão medir o resultado na prática? Quem vai acompanhar?
    sinais:
      - id: b5.s1
        peso: 1
        texto: Meta de 100% de acerto.
      - id: b5.s2
        peso: 1
        texto: >-
          O cliente não sabe o valor atual do indicador, então não há como provar a
          melhora.
      - id: b5.s3
        peso: 1
        texto: Ninguém assume a revisão durante o piloto.
    notas:
      - >-
        A pergunta 4 liga as duas camadas de métricas. Se deixar passar um caso real é
        pior, priorize recall; se o alarme falso custa caro, priorize precisão.
    referencias:
      - titulo: Duas camadas de métricas
        colunas: [Camada, Exemplo (fissuras em concreto), Quem entende]
        linhas:
          - [Negócio, Reduzir a inspeção de 8 h para 2 h por obra, Dono da PME]
          - [Técnica, Recall ≥ 95% para fissuras graves, Desenvolvedor]
      - titulo: Critério de aceite em três fases
        colunas: [Fase, Como funciona]
        linhas:
          - ["1. Teste com dados históricos", "A métrica técnica atinge a meta?"]
          - - "2. Piloto assistido (2 a 4 semanas)"
            - >-
              A IA roda em paralelo ao processo atual e uma pessoa compara os resultados.
          - ["3. Produção", A métrica de negócio é acompanhada mensalmente.]

  - numero: 6
    id: requisitos_nao_funcionais
    titulo: Requisitos não funcionais
    objetivo: >-
      Traduzir o dia a dia do cliente em requisitos técnicos e estimar o custo mensal de
      operação.
    saida_esperada: >-
      Lista de requisitos não funcionais com valores concretos e custo mensal estimado de
      operação, para comparar com o custo da dor do bloco 1.
    perguntas:
      - id: b6.o1
        tipo: obrigatoria
        texto: >-
          Onde a solução será usada? (computador no escritório, celular em campo, tablet)
      - id: b6.o2
        tipo: obrigatoria
        texto: Há internet estável no local de uso?
      - id: b6.o3
        tipo: obrigatoria
        texto: Quantas pessoas vão usar, e quantas vezes por dia?
      - id: b6.o4
        tipo: obrigatoria
        texto: O resultado precisa sair em segundos, ou pode levar alguns minutos?
      - id: b6.o5
        tipo: obrigatoria
        texto: Se o sistema ficar fora do ar por algumas horas, o que acontece?
      - id: b6.o6
        tipo: obrigatoria
        texto: Quanto a empresa aceita pagar por mês para manter a solução funcionando?
      - id: b6.a1
        tipo: aprofundamento
        texto: O uso é constante ou concentrado em certos horários e dias?
      - id: b6.a2
        tipo: aprofundamento
        texto: >-
          Os usuários têm familiaridade com tecnologia, ou a interface precisa ser muito
          simples?
      - id: b6.a3
        tipo: aprofundamento
        texto: >-
          Haverá crescimento de uso no próximo ano? (novas filiais, novos clientes)
      - id: b6.a4
        tipo: aprofundamento
        texto: Precisa funcionar em outro idioma?
    sinais:
      - id: b6.s1
        peso: 1
        texto: Exigência de tempo real em local sem internet, com modelo pesado.
      - id: b6.s2
        peso: 1
        texto: Orçamento mensal menor que o custo estimado de operação.
      - id: b6.s3
        peso: 1
        texto: Disponibilidade 24/7 exigida, sem orçamento compatível.
    notas:
      - >-
        Em soluções com LLM, cada consulta tem custo. Estime ainda na sessão: volume
        diário × custo por chamada × 22 dias úteis, e compare com a resposta da pergunta 6.
    referencias:
      - titulo: Tradução para requisitos técnicos
        colunas: [Resposta do cliente, Requisito técnico]
        linhas:
          - ['"Uso no canteiro, sem sinal"', Modo offline / modelo embarcado no celular]
          - ['"Resposta na hora"', "Latência < 2 s, inferência otimizada"]
          - ['"Pode ficar fora por um dia"', "Disponibilidade simples, sem redundância cara"]
          - ['"50 usuários, 200 análises/dia"', Dimensionamento de servidor ou de cota de API]
          - ['"Até R$ 300/mês"', Teto de custo de nuvem + API]

  - numero: 7
    id: riscos_compliance
    titulo: Riscos e compliance
    objetivo: >-
      Mapear riscos legais, éticos e de segurança e definir mitigações antes do início do
      projeto.
    saida_esperada: >-
      Matriz de riscos com mitigações e cláusula de limites de responsabilidade para a
      proposta.
    perguntas:
      - id: b7.o1
        tipo: obrigatoria
        texto: A solução vai lidar com dados pessoais? De clientes, funcionários ou terceiros?
      - id: b7.o2
        tipo: obrigatoria
        texto: >-
          A empresa tem alguém responsável pela LGPD (encarregado/DPO), mesmo que informal?
      - id: b7.o3
        tipo: obrigatoria
        texto: >-
          A decisão da IA afeta pessoas diretamente? (crédito, contratação, preço,
          segurança)
      - id: b7.o4
        tipo: obrigatoria
        texto: >-
          O setor tem regulação específica? (saúde, financeiro, engenharia, alimentos)
      - id: b7.o5
        tipo: obrigatoria
        texto: Quem responde legalmente se a IA errar?
      - id: b7.a1
        tipo: aprofundamento
        texto: >-
          Os dados podem ser processados fora do Brasil? (APIs de LLM costumam rodar no
          exterior)
      - id: b7.a2
        tipo: aprofundamento
        texto: Há informações confidenciais do negócio que não podem sair da empresa?
      - id: b7.a3
        tipo: aprofundamento
        texto: Algum grupo pode ser prejudicado por padrões nos dados históricos?
      - id: b7.a4
        tipo: aprofundamento
        texto: A empresa já sofreu vazamento ou incidente de segurança?
    sinais:
      - id: b7.s1
        peso: 1
        texto: Dados sensíveis (saúde, biometria) sem base legal clara.
      - id: b7.s2
        peso: 1
        texto: Decisão automatizada sobre pessoas, sem revisão humana.
      - id: b7.s3
        peso: 1
        texto: O cliente quer que a IA assuma a responsabilidade técnica.
    notas:
      - >-
        Classifique cada risco por probabilidade e impacto (baixo/médio/alto). Riscos
        altos nos dois eixos exigem mitigação definida antes do início. Acompanhe também
        a regulação de IA no Brasil (PL 2338/2023).
    referencias:
      - titulo: Principais riscos
        colunas: [Risco, Exemplo, Mitigação típica]
        linhas:
          - [LGPD, CPF enviado a uma API externa, "Anonimizar, base legal, contrato com o fornecedor"]
          - [Viés, Modelo de crédito que penaliza um bairro, Auditoria dos dados e dos resultados por grupo]
          - [Explicabilidade, Cliente pergunta por que foi recusado, Modelo interpretável ou justificativa registrada]
          - [Responsabilidade técnica, Laudo estrutural baseado na IA, IA como apoio; decisão final com engenheiro e ART]
          - [Segurança, "Prompt injection, vazamento de dados", "Controle de acesso, validação de entradas, logs"]
          - [Dependência de fornecedor, API muda preço ou sai do ar, "Camada de abstração, modelo alternativo"]

  - numero: 8
    id: integracao
    titulo: Integração e infraestrutura
    objetivo: >-
      Definir de onde a IA lê os dados e onde entrega o resultado. Se o funcionário
      precisar abrir mais um sistema, a adoção cai.
    saida_esperada: >-
      Diagrama simples dos sistemas e do fluxo de dados, nível de integração do MVP e
      lista de acessos que o cliente precisa liberar.
    perguntas:
      - id: b8.o1
        tipo: obrigatoria
        texto: >-
          Quais sistemas a empresa usa hoje? (ERP, CRM, planilhas, Google Workspace,
          Microsoft 365, WhatsApp)
      - id: b8.o2
        tipo: obrigatoria
        texto: >-
          Onde o resultado da IA precisa aparecer? (no ERP, por WhatsApp, por e-mail, num
          painel)
      - id: b8.o3
        tipo: obrigatoria
        texto: >-
          Quem cuida da tecnologia da empresa? Alguém interno, um fornecedor, ou ninguém?
      - id: b8.o4
        tipo: obrigatoria
        texto: >-
          Vocês têm acesso de administrador aos sistemas, ou depende de um fornecedor?
      - id: b8.o5
        tipo: obrigatoria
        texto: Há preferência por nuvem ou por servidor na própria empresa?
      - id: b8.a1
        tipo: aprofundamento
        texto: O ERP permite integração por API? O fornecedor cobra por isso?
      - id: b8.a2
        tipo: aprofundamento
        texto: Os dados chegam em tempo real ou são exportados periodicamente?
      - id: b8.a3
        tipo: aprofundamento
        texto: Existe login único (conta Google ou Microsoft) para os funcionários?
      - id: b8.a4
        tipo: aprofundamento
        texto: Quem fará a manutenção quando o projeto terminar?
    sinais:
      - id: b8.s1
        peso: 1
        texto: Sistema antigo, sem API nem exportação.
      - id: b8.s2
        peso: 1
        texto: Ninguém na empresa tem senha de administrador.
      - id: b8.s3
        peso: 1
        texto: O fornecedor do ERP cobra caro ou demora para liberar a integração.
      - id: b8.s4
        peso: 1
        texto: Não há ninguém para manter a solução depois da entrega.
    notas:
      - >-
        Para PMEs, comece no nível 0 ou 1 no MVP. Integração com ERP é onde prazo e custo
        costumam estourar.
    referencias:
      - titulo: Níveis de integração
        colunas: [Nível, Como funciona, Quando usar]
        linhas:
          - [0 — Manual, Usuário faz upload e baixa o resultado, MVP e piloto]
          - [1 — Arquivo, Leitura automática de planilha ou pasta compartilhada, Dados exportados periodicamente]
          - [2 — API, Conexão direta com ERP ou CRM, Uso diário em volume]
          - [3 — Automação, O sistema dispara a IA e recebe o resultado (webhook), Processo maduro e estável]

  - numero: 9
    id: restricoes
    titulo: Restrições do projeto
    objetivo: >-
      Fechar orçamento, prazo e pessoas, e verificar se o retorno justifica o
      investimento.
    saida_esperada: >-
      Orçamento e prazo acordados, ponto focal definido, cálculo de payback e modelo de
      suporte pós-entrega.
    perguntas:
      - id: b9.o1
        tipo: obrigatoria
        texto: Quanto a empresa pode investir para desenvolver a solução?
      - id: b9.o2
        tipo: obrigatoria
        texto: Existe uma data limite? O que acontece se ela não for cumprida?
      - id: b9.o3
        tipo: obrigatoria
        texto: >-
          Quem será o ponto focal da empresa, e quantas horas por semana pode dedicar?
      - id: b9.o4
        tipo: obrigatoria
        texto: Quem vai validar as entregas e aprovar cada etapa?
      - id: b9.o5
        tipo: obrigatoria
        texto: Depois da entrega, vocês querem suporte e manutenção contínuos?
      - id: b9.a1
        tipo: aprofundamento
        texto: O investimento pode ser dividido em fases?
      - id: b9.a2
        tipo: aprofundamento
        texto: O prazo vem de uma necessidade real (obra, safra, licitação) ou é desejo?
      - id: b9.a3
        tipo: aprofundamento
        texto: O código e o modelo treinado ficam com a empresa ou com o desenvolvedor?
      - id: b9.a4
        tipo: aprofundamento
        texto: Há outros projetos concorrendo pela atenção da equipe?
    sinais:
      - id: b9.s1
        peso: 1
        texto: Orçamento indefinido ("quanto custa?" sem nenhuma referência).
      - id: b9.s2
        peso: 1
        texto: Ninguém do cliente com tempo para validar as entregas.
      - id: b9.s3
        peso: 1
        texto: Prazo fixo e escopo crescente.
      - id: b9.s4
        peso: 1
        texto: Expectativa de manutenção gratuita após a entrega.
    notas:
      - >-
        Payback (meses) = Investimento inicial / (Economia mensal da dor − Custo mensal de
        operação). Cruza os blocos 1 e 6.
      - >-
        Exemplo: investimento de R$ 15.000, economia de R$ 4.000/mês e operação de
        R$ 500/mês. Ganho líquido mensal de R$ 3.500; payback de R$ 15.000 ÷ R$ 3.500 ≈
        4,3 meses.
      - >-
        Para PMEs, payback acima de 12 meses é difícil de aprovar. Nesse caso, reduza o
        escopo do MVP em vez de baixar o preço.
      - >-
        Escopo × prazo × custo: se o cliente fixa dois, o terceiro se ajusta. Prazo curto
        com orçamento baixo significa MVP menor.
      - >-
        Quando o cliente pergunta o preço cedo, ancore primeiro no custo da dor. Ex.: "30
        horas economizadas por mês valem R$ 3.000, fora o risco de processo; um projeto de
        R$ 20 mil em fases se paga em menos de 8 meses". Só depois apresente valores, e
        confirme as hipóteses usadas (como o custo da hora).

  - numero: 10
    id: relatorio
    titulo: Relatório de Descoberta
    objetivo: >-
      Consolidar as saídas dos blocos 1 a 9 em um relatório entregue ao cliente em até
      48 h, que serve de base para a proposta comercial.
    saida_esperada: >-
      Relatório de Descoberta entregue ao cliente em até 48 h, com o score final de
      viabilidade e a recomendação.
    secoes_relatorio:
      - Resumo executivo (meia página, lido em 2 minutos)
      - Frase-problema e custo da dor (bloco 1)
      - Fluxos as-is e to-be (bloco 2)
      - Tipo de solução e justificativa (bloco 3)
      - Inventário e score de prontidão de dados (bloco 4)
      - Indicadores, metas e critério de aceite (bloco 5)
      - Requisitos não funcionais e custo de operação (bloco 6)
      - Matriz de riscos e mitigações (bloco 7)
      - Mapa de integrações e acessos necessários (bloco 8)
      - "Escopo do MVP: o que entra e o que não entra"
      - Orçamento, prazo e payback (bloco 9)
      - Recomendação e próximos passos
    notas:
      - >-
        Recomendar "não seguir" quando for o caso constrói reputação: esse cliente tende
        a voltar quando estiver pronto.
      - >-
        A fase 0 é um produto vendável, não um pré-projeto gratuito. Padronizar a captura
        de dados, registrar casos e documentar critérios já gera ganho ao cliente e cria a
        base para o MVP. Ela deve ter escopo, prazo e preço próprios na proposta.

encerramento:
  objetivo: Os últimos 5 a 10 minutos fecham a sessão com compromissos claros.
  itens:
    - id: enc.resumo
      titulo: Resumo
      descricao: A frase-problema validada no bloco 1.
    - id: enc.recomendacao
      titulo: Recomendação preliminar
      descricao: Seguir, seguir com fase 0 ou não seguir agora, com o motivo em uma frase.
    - id: enc.proximos_passos
      titulo: Próximos passos
      descricao: O que o cliente envia (amostra de dados, acessos) e o que você entrega.
    - id: enc.participantes
      titulo: Participantes
      descricao: >-
        Quem precisa estar na próxima reunião (ex.: o especialista técnico ausente).
    - id: enc.prazo
      titulo: Prazo
      descricao: Data de entrega do Relatório de Descoberta, em até 48 h.

scores:
  # Bloco 4 — score de prontidão de dados (5 critérios × 0–3, máximo 15).
  prontidao_dados:
    criterios:
      - id: disponibilidade
        rotulo: Disponibilidade
        ancora_0: Não existe
        ancora_3: Exportável hoje
      - id: volume
        rotulo: Volume
        ancora_0: Dezenas de casos
        ancora_3: Milhares de casos
      - id: rotulos
        rotulo: Rótulos / resultado
        ancora_0: Ausente
        ancora_3: Registrado em todos
      - id: qualidade
        rotulo: Qualidade
        ancora_0: Caótica
        ancora_3: Padronizada
      - id: acesso_legal
        rotulo: Acesso legal (LGPD)
        ancora_0: Incerto
        ancora_3: Base legal clara
    faixas:
      - id: fase_0
        rotulo: Fase 0
        descricao: Começar por organizar e coletar dados.
        min: 0
        max: 5
      - id: mvp_ressalvas
        rotulo: MVP com ressalvas
        min: 6
        max: 10
      - id: pronto
        rotulo: Pronto para modelar
        min: 11
        max: 15

  # Bloco 10 — score final de viabilidade (6 critérios × 0–3, máximo 18).
  viabilidade_final:
    criterios:
      - id: dor_clara
        rotulo: Dor clara e relevante
        blocos_origem: [1]
      - id: ia_caminho_certo
        rotulo: IA é o caminho certo
        blocos_origem: [3]
      - id: prontidao_dados
        rotulo: Prontidão dos dados
        blocos_origem: [4]
      - id: retorno_viavel
        rotulo: Retorno viável (payback)
        blocos_origem: [6, 9]
      - id: riscos_controlaveis
        rotulo: Riscos controláveis
        blocos_origem: [7]
      - id: comprometimento_cliente
        rotulo: Comprometimento do cliente
        blocos_origem: [9]
    faixas:
      - id: nao_seguir
        rotulo: Não seguir agora
        descricao: Explicar o motivo e indicar o que precisa mudar.
        min: 0
        max: 8
      - id: seguir_fase_0
        rotulo: Seguir com fase 0
        descricao: Estruturar dados ou processo antes de desenvolver.
        min: 9
        max: 13
      - id: seguir
        rotulo: Seguir
        descricao: Proposta para o MVP.
        min: 14
        max: 18
