name: Documentação

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # toda segunda, 6h em Brasília: links externos quebram sem commit
  workflow_dispatch:

# Só leitura no workflow inteiro; só o job que publica recebe permissão para o Pages.
permissions:
  contents: read

# Uma publicação por vez; uma nova espera a anterior terminar, em vez de cancelá-la no meio.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Compila o site em modo estrito (qualquer aviso vira erro) e confere os links.
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LYCHEE_VERSAO: 0.24.2
      # SHA-256 do lychee-x86_64-unknown-linux-gnu.tar.gz, do .sha256 da release oficial.
      LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Instalar as dependências da documentação
        run: uv sync --locked --group docs

      - name: Compilar o site (mkdocs build --strict)
        run: uv run --group docs mkdocs build --strict

      - name: Baixar o lychee e conferir o hash
        run: |
          arquivo="lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$arquivo" "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSAO}/${arquivo}"
          echo "${LYCHEE_SHA256}  ${arquivo}" | sha256sum --check
          # O binário fica numa pasta com o nome do arquivo: extrai só ele, sem a pasta.
          tar -xzf "$arquivo" --strip-components=1 "${arquivo%.tar.gz}/lychee"

      - name: Links quebrados (lychee)
        # Links para arquivos do próprio repositório são conferidos nos arquivos locais: num
        # PR, um arquivo novo ainda não existe na main do GitHub.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # limite maior de pedidos ao GitHub
        run: >-
          ./lychee --config lychee.toml
          --remap "https://github\.com/Guile1984/app-descoberta/(blob|tree)/main/(.*) file://${GITHUB_WORKSPACE}/\$2"
          "site/**/*.html"

      - name: Guardar o site para a publicação
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Publica no GitHub Pages: só o que chegou na main, e só depois de compilar sem avisos.
  publicar:
    needs: compilar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
