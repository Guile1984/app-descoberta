name: CI

on:
  push:
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: Instalar o navegador dos testes e2e (Playwright)
        run: uv run playwright install --with-deps chromium

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Testes (pytest, incluindo os e2e no navegador)
        run: uv run pytest --cov=descoberta
