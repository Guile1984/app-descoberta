name: CI

on:
  push:
  pull_request:

# Só leitura: o CI não precisa escrever nada no repositório.
permissions:
  contents: read

# As actions ficam fixadas pelo hash do commit (o comentário mostra a versão): uma tag
# pode ser movida para outro código; o hash, não. O Dependabot propõe as atualizações.
jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: Instalar o navegador dos testes e2e (Playwright)
        run: uv run playwright install --with-deps chromium

      - name: Lint (ruff, inclusive as regras de segurança S)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Testes (pytest, incluindo os e2e no navegador)
        run: uv run pytest --cov=descoberta

  # Portabilidade: o público da app usa Windows. Testes sem navegador (os e2e já rodam
  # no Ubuntu e, no dia a dia, no Windows de quem desenvolve).
  testes-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: Testes sem navegador
        run: uv run pytest -m "not e2e"
