name: CI

on:
  push:
  pull_request:

# Só leitura: o CI não precisa escrever nada no repositório.
permissions:
  contents: read

# As actions ficam fixadas pelo hash do commit (o comentário mostra a versão): uma tag
# pode ser movida para outro código; o hash, não. O Dependabot propõe as atualizações.
jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: Instalar o navegador dos testes e2e (Playwright)
        run: uv run playwright install --with-deps chromium

      - name: Lint (ruff, inclusive as regras de segurança S)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Testes (pytest, incluindo os e2e no navegador)
        run: uv run pytest --cov=descoberta

  # Portabilidade: o público da app usa Windows. Testes sem navegador (os e2e já rodam
  # no Ubuntu e, no dia a dia, no Windows de quem desenvolve).
  testes-windows:
    runs-on: windows-latest
    # A suíte leva ~20 min no runner Windows (disco mais lento), contra ~3 min no Linux.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: Testes sem navegador
        # faulthandler_timeout: se um teste passar de 2 min, o pytest mostra onde cada
        # thread está parada (útil para distinguir um teste travado de um runner lento).
        env:
          PYTHONUNBUFFERED: "1"
        run: uv run pytest -m "not e2e" -o faulthandler_timeout=120
