# Arquivos de terceiros copiados como estão: o htmx (o hash SRI precisa bater com o
# original) e a fonte DejaVu Sans do PDF, com a licença (cada fonte tem ~750 KB).
exclude: ^(src/descoberta/web/static/htmx\.min\.js|src/descoberta/relatorio/fontes/.*)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # O mkdocs.yml usa uma tag do Python (!!python/name) que o leitor seguro recusa; o
        # próprio MkDocs confere o arquivo (mkdocs build --strict, no CI).
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
