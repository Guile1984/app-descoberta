[project]
name = "descoberta"
version = "0.1.0"
description = "App local para conduzir sessões de descoberta de soluções de IA com PMEs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-METODOLOGIA.md", "THIRD_PARTY_NOTICES.md", "src/descoberta/relatorio/fontes/LICENSE-DejaVu.txt"]
authors = [{ name = "Guilherme Ferraz Stauffer" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "anthropic>=1",
    "fastapi>=0.142.4",
    "jinja2>=3.1.6",
    "pillow>=12.3",
    "pydantic>=2",
    "pypdf>=6.20",
    "python-docx>=1.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6",
    "reportlab>=5.0",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-playwright>=0.9.0",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# S: regras de segurança do flake8-bandit (Sprint 8).
select = ["E", "F", "I", "UP", "B", "SIM", "PT", "S"]

[tool.ruff.lint.per-file-ignores]
# Nos testes: assert é o próprio pytest (S101); "0.0.0.0" aparece só para provar que a app
# recusa (S104); random gera casos de teste, não segredos (S311); git é chamado para
# conferir o que está versionado (S603, S607).
"tests/**" = ["S101", "S104", "S311", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "e2e: testes no navegador (Playwright); para pular: uv run pytest -m \"not e2e\"",
]

[tool.coverage.run]
source = ["descoberta"]

[tool.coverage.report]
show_missing = true
