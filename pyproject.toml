[project]
name = "descoberta"
version = "0.1.0"
description = "App local para conduzir sessões de descoberta de soluções de IA com PMEs."
readme = "README.md"
authors = [{ name = "Guilherme Ferraz Stauffer" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["descoberta"]

[tool.coverage.report]
show_missing = true
