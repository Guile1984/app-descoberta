[project]
name = "descoberta"
version = "0.1.0"
description = "App local para conduzir sessões de descoberta de soluções de IA com PMEs."
readme = "README.md"
authors = [{ name = "Guilherme Ferraz Stauffer" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.4",
    "jinja2>=3.1.6",
    "pillow>=12.3",
    "pydantic>=2",
    "pypdf>=6.20",
    "python-docx>=1.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6",
    "reportlab>=5.0",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-playwright>=0.9.0",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "e2e: testes no navegador (Playwright); para pular: uv run pytest -m \"not e2e\"",
]

[tool.coverage.run]
source = ["descoberta"]

[tool.coverage.report]
show_missing = true
